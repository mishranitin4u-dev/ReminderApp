name: daily_reminder
description: Daily Reminder V2.2 with custom sounds, medicine details, voice input and caregiver alerts.
publish_to: "none"
version: 2.2.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^1.0.8
  shared_preferences: ^2.3.2
  speech_to_text: ^7.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
