name: Build Daily Reminder APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter and Java
        run: |
          flutter --version
          java -version

      # This ZIP intentionally contains only the Android app-specific files.
      # Generate the missing Gradle/Activity/resources scaffolding, then restore
      # the app's custom manifest and alarm sounds so flutter create cannot drop them.
      - name: Generate Android project scaffolding
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/daily-reminder-backup"
          cp android/app/src/main/AndroidManifest.xml "$RUNNER_TEMP/daily-reminder-backup/AndroidManifest.xml"
          mkdir -p "$RUNNER_TEMP/daily-reminder-backup/raw"
          cp android/app/src/main/res/raw/*.wav "$RUNNER_TEMP/daily-reminder-backup/raw/"
          flutter create --platforms=android --project-name daily_reminder .
          mkdir -p android/app/src/main/res/raw
          cp "$RUNNER_TEMP/daily-reminder-backup/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml
          cp "$RUNNER_TEMP/daily-reminder-backup/raw/"*.wav android/app/src/main/res/raw/

      - name: Get dependencies
        run: flutter pub get

      - name: Align flutter_timezone Kotlin JVM target
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import sys
          roots = [Path.home() / '.pub-cache' / 'hosted' / 'pub.dev']
          files = []
          for root in roots:
              if root.exists():
                  files.extend(root.glob('flutter_timezone-*/android/build.gradle'))
                  files.extend(root.glob('flutter_timezone-*/android/build.gradle.kts'))
          if not files:
              print('Could not locate flutter_timezone Android Gradle file in pub cache.')
              sys.exit(1)
          for path in files:
              text = path.read_text()
              updated = text
              updated = updated.replace("jvmTarget = '1.8'", "jvmTarget = '11'")
              updated = updated.replace('jvmTarget = \"1.8\"', 'jvmTarget = \"11\"')
              updated = updated.replace('JavaVersion.VERSION_1_8', 'JavaVersion.VERSION_11')
              updated = updated.replace('JvmTarget.JVM_1_8', 'JvmTarget.JVM_11')
              if updated == text:
                  print(f'No recognized Kotlin JVM target setting found in {path}; leaving file unchanged.')
                  print('Relevant lines:')
                  for line in text.splitlines():
                      if 'jvmTarget' in line or 'kotlinOptions' in line or 'VERSION_1_8' in line:
                          print(line)
                  sys.exit(1)
              path.write_text(updated)
              print(f'Updated Kotlin JVM target to 11 in {path}')
          PYCODE

      - name: Build release APK
        run: flutter build apk --release

      - name: Confirm APK exists
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Reminder-V2.2-Fixed-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
