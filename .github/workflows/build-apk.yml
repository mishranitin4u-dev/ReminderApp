
name: Build Daily Reminder APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter and Java
        run: |
          flutter --version
          java -version

      - name: Generate Android project scaffolding
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/daily-reminder-backup"
          cp android/app/src/main/AndroidManifest.xml "$RUNNER_TEMP/daily-reminder-backup/AndroidManifest.xml"
          mkdir -p "$RUNNER_TEMP/daily-reminder-backup/raw"
          cp android/app/src/main/res/raw/*.wav "$RUNNER_TEMP/daily-reminder-backup/raw/"
          flutter create --platforms=android --project-name daily_reminder .
          mkdir -p android/app/src/main/res/raw
          cp "$RUNNER_TEMP/daily-reminder-backup/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml
          cp "$RUNNER_TEMP/daily-reminder-backup/raw/"*.wav android/app/src/main/res/raw/

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Confirm APK exists
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Reminder-V2.2-Fixed-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
